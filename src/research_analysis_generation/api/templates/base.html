<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Autonomous Report Generator{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block extra_style %}{% endblock %}
</head>
<body>
  {% block topbar %}
  <div class="topbar">
    <span class="brand">Autonomous Report Generator</span>
    <form method="post" action="/logout">
      <button type="submit">Log out</button>
    </form>
  </div>
  {% endblock %}

  {% block content %}{% endblock %}

  {% block spinner %}{% endblock %}

  {% block extra_script %}{% endblock %}
</body>
</html>
